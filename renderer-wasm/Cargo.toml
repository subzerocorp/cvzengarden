[package]
name = "resumezen-renderer-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "wasm-bindgen bridge over resumezen-renderer for the Garden chrome."
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/subzerocorp/cvzengarden"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
resumezen-renderer = { path = "../renderer" }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true

# ResumeZen on Cloudflare Workers.
# Build first: `just assets` (compiles the Worker and gathers dist/).
# Secrets (wrangler secret put): DATABASE_URL (libsql://…), DATABASE_AUTH_TOKEN, RZ_ADMIN_TOKEN.
name = "cvzengarden"
main = "_build/default/backend/output/backend/worker.mjs"
compatibility_date = "2026-09-01"

# Custom domains: both apex hosts and their www serve the same app (decision 2026-09-16, NAT-351).
# The zones live on Cloudflare; `wrangler deploy` creates the DNS records and certificates.
routes = [
  { pattern = "cvzengarden.com", custom_domain = true },
  { pattern = "www.cvzengarden.com", custom_domain = true },
  { pattern = "resumezengarden.com", custom_domain = true },
  { pattern = "www.resumezengarden.com", custom_domain = true },
]

# The workers.dev URL stays on as the fallback address alongside the custom domains.
workers_dev = true
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
# Every request reaches the Worker first; it answers the API, the SPA routes and the
# submission stylesheets itself and hands everything else to the assets binding.
run_worker_first = true
# Files answer under their exact names: no redirect from example.html to example.
html_handling = "none"

[vars]
RZ_SEED_DEMO = "0"

[observability]
enabled = true

# Branch previews: one Worker per pull request (`cvzengarden-pr-N`, see `just deploy-preview`),
# on workers.dev only (routes are not inherited, so the custom domains stay on production),
# against its own Turso database, with the demo submissions seeded.
[env.preview]
workers_dev = true
preview_urls = false
# Never inherit the custom domains: deploying a preview must not move production.
routes = []

[env.preview.vars]
RZ_SEED_DEMO = "1"

[env.preview.observability]
enabled = true
